<!DOCTYPE html>
<html lang="id">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – miyzaab edu</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dark.css">
  <script src="js/protect.js"></script>
</head>

<body data-page="quiz">

  <!-- AUTO NAVBAR (SATU-SATUNYA) -->
  <div id="navbar"></div>

  <!-- QUIZ -->
  <main class="quiz-container">
    <div class="quiz-card">
      <h2>Quiz: Dasar Istiqamah</h2>

      <form id="quizForm">

        <div class="quiz-step animate-on-scroll">
          <p class="quiz-question">1. Apa makna istiqamah?</p>
          <div class="options-grid">
            <label class="quiz-option">
              <input type="radio" name="q1" value="0">
              <span class="option-content">Semangat sesaat</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="q1" value="1">
              <span class="option-content">Konsisten di atas kebenaran</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="q1" value="0">
              <span class="option-content">Banyak amal tanpa ilmu</span>
            </label>
          </div>
        </div>

        <div class="quiz-step animate-on-scroll">
          <p class="quiz-question">2. Istiqamah paling dibutuhkan pada?</p>
          <div class="options-grid">
            <label class="quiz-option">
              <input type="radio" name="q2" value="0">
              <span class="option-content">Awal hijrah</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="q2" value="1">
              <span class="option-content">Sepanjang hayat</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="q2" value="0">
              <span class="option-content">Saat ramai saja</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-primary full">Lihat Hasil</button>
      </form>
    </div>
  </main>

  <!-- SCRIPT (HANYA DI SINI) -->
  <script src="js/navbar.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/quiz.js"></script>
</body>

</html>
