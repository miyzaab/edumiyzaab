<!DOCTYPE html>
<html lang="id">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – miyzaab edu</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dark.css">
  <script src="js/protect.js"></script>
</head>

<body data-page="quiz" class="page-background">

  <!-- AUTO NAVBAR (SATU-SATUNYA) -->
  <div id="navbar"></div>

  <!-- AUTH CHECK -->
  <script type="module">
    import { checkAuth } from './js/auth.js';
    checkAuth((user) => {
      if (!user) window.location.href = 'login.html';
    });
  </script>

  <!-- QUIZ -->
  <main class="quiz-container">
    <div class="quiz-card">
      <h2>Quiz: Adab Menuntut Ilmu</h2>

      <form id="quizForm">
        <div id="questionsContainer">
          <!-- JS Injected Here -->
        </div>

        <button type="submit" class="btn-primary full" style="margin-top: 2rem;">Lihat Hasil</button>
      </form>
    </div>
  </main>

  <!-- SCRIPT (HANYA DI SINI) -->
  <script src="js/navbar.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/quiz.js"></script>
</body>

</html>
