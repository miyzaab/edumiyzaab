<!DOCTYPE html>
<html lang="id">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk – miyzaab edu</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dark.css">
</head>

<body data-page="login">

  <!-- LOGIN -->
  <main class="auth-container">
    <div class="auth-card">
      <h2>Masuk Akun</h2>
      <p class="auth-desc">Silakan masuk untuk melanjutkan belajar</p>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" placeholder="email@email.com" required>

        <label>Password</label>
        <input type="password" placeholder="••••••••" required>

        <button type="submit" class="btn-primary full">Masuk</button>

        <div style="text-align: right; margin-top: 0.75rem;">
          <a href="forgot-password.html" style="font-size: 0.85rem; color: #666;">Lupa Password?</a>
        </div>
      </form>

      <div style="text-align: center; margin: 1.5rem 0; color: #9ca3af; font-size: 0.9rem;">
        <span>atau</span>
      </div>

      <button id="googleSignInBtn"
        style="width: 100%; padding: 0.75rem; background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.75rem; transition: all 0.2s;">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
            fill="#4285F4" />
          <path
            d="M9.003 18c2.43 0 4.467-.806 5.956-2.184L12.05 13.56c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9.003 18z"
            fill="#34A853" />
          <path
            d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
            fill="#FBBC05" />
          <path
            d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29c.708-2.127 2.692-3.71 5.036-3.71z"
            fill="#EA4335" />
        </svg>
        <span>Masuk dengan Google</span>
      </button>

      <p class="auth-footer">
        Belum punya akun?
        <a href="register.html">Daftar</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { login, checkAuth, signInWithGoogle } from './js/auth.js';

    // Get redirect URL from query params
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || 'index.html';

    // Redirect if already logged in
    checkAuth((user) => {
      if (user) {
        window.location.href = redirectUrl;
      }
    });

    // Handle login form
    const form = document.getElementById('loginForm');
    const emailInput = form.querySelector('input[type="email"]');
    const passwordInput = form.querySelector('input[type="password"]');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      console.log('Attempting login with:', email);

      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        // Try to login
        const result = await login(email, password);
        console.log('Login Result:', result);

        if (result.success) {
          console.log('Login success, redirecting to:', redirectUrl);
          window.location.href = redirectUrl;
        } else {
          console.error('Login Failed:', result.error);
          alert('Login gagal: ' + result.error);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Masuk';
        }
      } catch (err) {
        console.error('Unexpected Login Error:', err);
        alert('Terjadi kesalahan sistem: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    });

    // Handle Google Sign-In
    const googleBtn = document.getElementById('googleSignInBtn');
    googleBtn.addEventListener('click', async () => {
      googleBtn.disabled = true;
      googleBtn.querySelector('span').textContent = 'Memproses...';

      try {
        const result = await signInWithGoogle();
        console.log('Google Sign-In Result:', result);

        if (result.success) {
          window.location.href = redirectUrl;
        } else {
          console.error('Google Sign-In Error:', result.error);
          alert('Login gagal: ' + result.error);
          googleBtn.disabled = false;
          googleBtn.querySelector('span').textContent = 'Masuk dengan Google';
        }
      } catch (error) {
        console.error('Google Sign-In Exception:', error);
        alert('Error: ' + error.message);
        googleBtn.disabled = false;
        googleBtn.querySelector('span').textContent = 'Masuk dengan Google';
      }
    });
  </script>
</body>

</html>
