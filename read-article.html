<!DOCTYPE html>
<html lang="id">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel Islami – miyzaab edu</title>

  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=3">
  <link rel="stylesheet" href="css/dark.css?v=3">
</head>

<body data-page="article" class="page-background">

  <!-- AUTO NAVBAR -->
  <div id="navbar"></div>

  <main class="article-container animate-on-scroll">
    <div id="articleContent" class="article-content">
      <!-- Content Injected Here -->
      <p>Memuat artikel...</p>
    </div>
  </main>

  <script src="js/navbar.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/articles.js"></script>
  <script>
    // Logic to load article
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));
    const container = document.getElementById('articleContent');

    async function loadArticleContent() {
      // Fetch data
      const articles = await getArticles();

      // Find article
      const article = articles.find(a => a.id === id);

      if (article) {
        document.title = `${article.title} – miyzaab edu`;

        container.innerHTML = `
              <div class="article-meta">
                  <span class="author">${article.author}</span> • <span class="date">${article.date}</span>
                  <a href="index.html" style="float: right; text-decoration: none; color: var(--primary);">← Kembali</a>
              </div>
              <h1>${article.title}</h1>
              <div class="article-thumb ${article.thumb}" style="width: 100%; height: 300px; border-radius: 1rem; margin-bottom: 2rem;"></div>
              ${article.content}
          `;
      } else {
        container.innerHTML = `
              <h1>Artikel Tidak Ditemukan</h1>
              <p>Maaf, artikel yang Anda cari tidak tersedia.</p>
              <a href="index.html" class="btn-primary">Kembali ke Beranda</a>
          `;
      }
    }

    loadArticleContent();
  </script>
</body>

</html>
