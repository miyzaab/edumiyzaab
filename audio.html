<!DOCTYPE html>
<html lang="id">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Pelajaran – miyzaab edu</title>

  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="stylesheet" href="css/components.css?v=4">
  <link rel="stylesheet" href="css/dark.css?v=4">
</head>

<body data-page="audio" class="page-background">

  <!-- AUTO NAVBAR -->
  <div id="navbar"></div>

  <main class="audio-layout">

    <!-- LEFT: MAIN PLAYER -->
    <div class="player-section">
      <div class="now-playing-card">
        <div class="album-art-wrapper">
          <div class="album-art" id="albumArt">
            <!-- Icon placeholder if no image -->
            <span style="font-size: 3rem;">🎧</span>
          </div>
        </div>

        <!-- Visualizer -->
        <div class="visualizer" id="visualizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <div class="track-info">
          <h2 id="trackTitle">Memuat Audio...</h2>
          <p id="trackAuthor">Miyzaab Edu</p>
        </div>

        <div class="progress-container">
          <input type="range" id="progress" value="0">
          <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="player-controls">
          <button id="prevBtn" class="ctrl-btn sm">⏮</button>
          <button id="playBtn" class="ctrl-btn lg">▶</button>
          <button id="nextBtn" class="ctrl-btn sm">⏭</button>
        </div>

        <audio id="audioElement"></audio>
      </div>
    </div>

    <!-- RIGHT: PLAYLIST -->
    <div class="playlist-sidebar">
      <div class="playlist-header">
        <h3>Kategori Audio</h3>
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs" id="categoryTabs">
        <!-- Generated by JS -->
      </div>

      <div class="playlist-header">
        <h3>Daftar Putar</h3>
        <span class="badge" id="trackCount">0 Trek</span>
      </div>
      <div class="audio-list" id="audioList">
        <!-- Generated by JS -->
      </div>
    </div>

  </main>

  <script src="js/navbar.js"></script>
  <script src="js/audio.js"></script>
</body>

</html>
