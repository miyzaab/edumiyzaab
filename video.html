<!DOCTYPE html>
<html lang="id">

<head>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Kajian – miyzaab edu</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark.css">
    <script src="js/protect.js"></script>
</head>

<body data-page="video" class="page-background">

    <!-- AUTO NAVBAR -->
    <div id="navbar"></div>

    <!-- VIDEO CONTENT -->
    <main class="video-container">

        <div class="main-player-wrapper">
            <div class="video-frame">
                <iframe id="mainPlayer" src="" title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>
            <h1 id="mainTitle">Memuat Video...</h1>
        </div>

        <div class="playlist-section">
            <h3>Daftar Putar</h3>
            <div class="playlist-grid" id="playlistGrid">
                <!-- Playlist items generated by JS -->
            </div>
        </div>

    </main>

    <!-- SCRIPT -->
    <script src="js/navbar.js"></script>
    <script src="js/video.js"></script>
</body>

</html>
