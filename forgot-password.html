<!DOCTYPE html>
<html lang="id">

<head>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password – miyzaab edu</title>

    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/components.css?v=4">
    <link rel="stylesheet" href="css/dark.css?v=4">
</head>

<body data-page="forgot-password">

    <main class="auth-container">
        <div class="auth-card">
            <h2 style="margin-bottom: 0.5rem;">Reset Password</h2>
            <p class="auth-desc">Masukkan email Anda untuk menerima link reset password</p>

            <form id="resetForm">
                <label>Email Terdaftar</label>
                <input type="email" id="email" placeholder="email@email.com" required>

                <button type="submit" class="btn-primary full">Kirim Link Reset</button>
            </form>

            <p class="auth-footer">
                Ingat password?
                <a href="login.html">Masuk</a>
            </p>
        </div>
    </main>

    <script type="module">
        import { resetPassword } from './js/auth.js';

        const form = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                alert('Mohon masukkan email');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';

            const result = await resetPassword(email);

            if (result.success) {
                alert('Link reset password telah dikirim ke email Anda. Silakan cek inbox/spam.');
                window.location.href = 'login.html';
            } else {
                alert(result.error);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kirim Link Reset';
            }
        });
    </script>

</body>

</html>
