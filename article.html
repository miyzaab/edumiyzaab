<!DOCTYPE html>
<html lang="id">

<head>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel Islami – miyzaab edu</title>

  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/components.css?v=3">
  <link rel="stylesheet" href="css/dark.css?v=3">
</head>

<body data-page="article">

  <!-- AUTO NAVBAR -->
  <div id="navbar"></div>

  <!-- AUTH CHECK -->
  <script type="module">
    import { checkAuth } from './js/auth.js';

    let authChecked = false;
    checkAuth((user) => {
      if (!authChecked) {
        authChecked = true;
        if (!user) {
          window.location.href = 'login.html';
        }
      }
    });
  </script>

  <!-- ARTICLE HEADER -->
  <header class="hero" style="padding: 4rem 2rem 2rem; min-height: auto;">
    <h1>Kumpulan Artikel</h1>
    <p>Perkaya wawasan dengan tulisan ilmiah dari sumber terpercaya</p>
  </header>

  <!-- ARTICLE GRID -->
  <main class="latest-articles" style="padding-top: 2rem;">
    <div class="articles-grid" id="articlesContainer">
      <!-- Loading placeholder -->
      <p>Memuat semua artikel...</p>
    </div>
  </main>


  <script src="js/articles.js"></script>
  <script src="js/cms-loader.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('articlesContainer');

      // Coba load dari CMS dulu
      let articleList = [];

      try {
        const response = await fetch('/content/articles/index.json');
        if (response.ok) {
          articleList = await response.json();
        }
      } catch (e) {
        console.log('CMS data not found, using legacy data');
      }

      // Fallback ke data lama jika CMS kosong
      if (articleList.length === 0 && typeof articles !== 'undefined') {
        articleList = articles;
      }

      if (articleList.length > 0) {
        container.innerHTML = articleList.map((article, index) => `
          <article class="article-card" style="animation: fadeInUp 0.5s ease backwards ${index * 0.1}s;">
            <div class="article-thumb ${article.thumb}"></div>
            <div class="article-body">
              <div class="article-meta">
                <span class="author">${article.author}</span> • <span class="date">${article.date}</span>
              </div>
              <a href="read-article.html?id=${article.id}">
                <h3>${article.title}</h3>
              </a>
              <p>${(article.content || '').replace(/<[^>]*>?/gm, '').substring(0, 100)}...</p>
            </div>
          </article>
        `).join('');
      } else {
        container.innerHTML = '<p>Belum ada artikel.</p>';
      }
    });
  </script>

  <script src="js/navbar.js"></script>
</body>

</html>
