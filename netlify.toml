[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Redirect untuk SPA admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Headers untuk keamanan
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Identity settings
[build.environment]
  NODE_VERSION = "18"
